<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nivo:theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand2/favicon.svg" />
    <!-- interactive-widget=resizes-content: مرورگرهای جدید (کروم/سافاری) با باز شدن کیبورد،
         layout viewport (و در نتیجه dvh) رو واقعاً کوچیک می‌کنن به‌جای overlay کردنش —
         تکمیل‌کننده‌ی fallback مبتنی بر visualViewport در ShopChatPage.tsx -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>نیوو</title>
    <meta name="description" content="جواب خودکار دایرکت، ثبت سفارش و پرداخت توی چت. رایگان شروع کن." />
    <!-- docs/PRD-nivo-lead-shop-seller-signup.md §5.7 — پیش‌نمایش لینک (اینستاگرام/تلگرام)؛ og:image عمداً نیست چون public/pwa/og-default.png هنوز ساخته نشده -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="نیوو" />
    <meta property="og:title" content="نیوو — دستیار فروش هوشمند اینستاگرام" />
    <meta property="og:description" content="جواب خودکار دایرکت، ثبت سفارش و پرداخت توی چت. رایگان شروع کن." />

    <meta name="theme-color" content="#10b981" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نیوو" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
