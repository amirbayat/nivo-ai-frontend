<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nivo:theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand2/favicon.svg" />
    <!-- interactive-widget=resizes-content: مرورگرهای جدید (کروم/سافاری) با باز شدن کیبورد،
         layout viewport (و در نتیجه dvh) رو واقعاً کوچیک می‌کنن به‌جای overlay کردنش —
         تکمیل‌کننده‌ی fallback مبتنی بر visualViewport در ShopChatPage.tsx -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>نیوو</title>

    <meta name="theme-color" content="#10b981" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نیوو" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__debug_datepicker_entry.tsx"></script>
  </body>
</html>
