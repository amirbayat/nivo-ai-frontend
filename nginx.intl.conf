server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # بدون location /blog — نسخه‌ی INTL هیچ فیچر مقاله/SEO (docs/PRD-articles-seo-blog.md)
    # ندارد، پس نیازی به proxy_pass به بک‌اند نیست. همین نبودِ این بلاک، باگ اصلی این فایل
    # بود: nginx.spa.conf مشترک با IR را کپی می‌کرد که در آن proxy_pass به هاست داخلی بک‌اند
    # ایران (nivo-backend.amir-bayat-nivo.svc) اشاره داشت — روی namespace جدای INTL آن
    # hostname اصلاً resolve نمی‌شود و nginx با "host not found in upstream" اصلاً بالا نمی‌آمد.

    # SPA routing — همه مسیرها به index.html برگردند
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker و manifest (vite-plugin-pwa) هرگز نباید immutable کش شوند — وگرنه
    # مرورگر بعد از هر دیپلوی متوجه نسخه‌ی جدید نمی‌شود و آپدیت به کاربرها نمی‌رسد.
    # این بلاک‌ها باید قبل از قانون کش عمومی زیر بیایند تا اولویت داشته باشند.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }

    # index.html هم باید همیشه no-cache باشد — این فایل به assetهای هش‌شده‌ی همون بیلد
    # اشاره می‌کند (script src="/assets/index-XXXX.js")؛ اگر خودش کش شود، مرورگر بعد از
    # دیپلوی جدید همچنان همون HTML قدیمی (با ارجاع به assetهای دیگر/حذف‌شده) را می‌بیند
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
        access_log off;
    }

    # کش برای فایل‌های استاتیک
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
